<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AT LiveCaption - Audience</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 3vh 4vw;
    box-sizing: border-box;
  }
  #wrap[data-position="top"] { justify-content: flex-start; }
  #wrap[data-position="center"] { justify-content: center; }
  #wrap[data-position="bottom"] { justify-content: flex-end; }
  #box {
    background-color: rgba(0,0,0,0);
  }
  /* block, not inline-block: a shrink-to-fit box visibly wobbles side to
     side as the live partial line grows/shrinks word by word, especially
     with centered text (both edges move). A full-width bar keeps the
     line's position fixed and only the text inside it changes. Same
     rounded-card treatment as the overlay -- the two are meant to look
     like the same product, just sized for a full screen instead of a
     lower-third over camera. */
  #box .line {
    background-color: color-mix(in srgb, var(--bg-color) calc(var(--bg-opacity) * 100%), transparent);
    display: block;
    padding: 0.35em 0.75em;
    margin: 0.2em 0;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    transition: opacity 0.2s linear;
  }
</style>
</head>
<body>
  <div id="wrap" data-position="bottom">
    <div id="box" data-max-lines="3"></div>
  </div>
  <script src="/static/caption-client.js"></script>
  <script>
    ATLiveCaptionClient.connect("audience", { wrap: document.getElementById("wrap"), box: document.getElementById("box") });
  </script>
</body>
</html>
