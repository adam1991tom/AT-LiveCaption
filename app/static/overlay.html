<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AT LiveCaption - Overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 3vh 4vw;
    box-sizing: border-box;
  }
  #wrap[data-position="top"] { justify-content: flex-start; }
  #wrap[data-position="center"] { justify-content: center; }
  #wrap[data-position="bottom"] { justify-content: flex-end; }
  /* block, not inline-block: a shrink-to-fit box visibly wobbles side to
     side as the live partial line grows/shrinks word by word, especially
     with centered text (both edges move). A full-width bar keeps the
     line's position fixed and only the text inside it changes. */
  #box .line {
    background-color: color-mix(in srgb, var(--bg-color) calc(var(--bg-opacity) * 100%), transparent);
    display: block;
    padding: 0.15em 0.4em;
    margin: 0.15em 0;
    border-radius: 4px;
    transition: opacity 0.2s linear;
  }
</style>
</head>
<body>
  <div id="wrap" data-position="bottom">
    <div id="box" data-max-lines="2"></div>
  </div>
  <script src="/static/caption-client.js"></script>
  <script>
    ATLiveCaptionClient.connect("overlay", { wrap: document.getElementById("wrap"), box: document.getElementById("box") });
  </script>
</body>
</html>
